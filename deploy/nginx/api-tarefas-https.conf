# Bloco HTTPS do Nginx para a CyberIncident API (certificado Let's Encrypt emitido para o IP publico).
#
# Modelo: o marcador @@IP@@ e substituido por deploy/https_ip.sh, que so instala este arquivo
# DEPOIS que o certificado foi emitido (sem certificado o "nginx -t" falharia).
# A porta 80 continua ativa (arquivo api-tarefas.conf); nao ha redirecionamento forcado nem HSTS,
# pois o certificado de IP e de curta duracao (~6 dias) e a renovacao e automatica.

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/@@IP@@/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/@@IP@@/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:2m;
    ssl_session_timeout 1h;
    ssl_session_tickets off;

    client_max_body_size 1m;

    access_log /var/log/nginx/api-tarefas.access.log;
    error_log  /var/log/nginx/api-tarefas.error.log;

    location / {
        # Mesma politica de escrita da porta 80: GET/HEAD/OPTIONS publicos; escrita so para IPs
        # listados em /etc/nginx/api-tarefas-writers.conf (arquivo local da VM, fora do Git).
        limit_except GET HEAD OPTIONS {
            include /etc/nginx/api-tarefas-writers*.conf;
            deny all;
        }

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
}
