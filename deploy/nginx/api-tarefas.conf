# Configuracao do Nginx como proxy reverso para a API de Tarefas.
#
# O Uvicorn escuta apenas em 127.0.0.1:8000 (nunca exposto diretamente
# a internet). O Nginx recebe as requisicoes externas na porta 80 (e,
# quando houver certificado, na 443) e as repassa internamente.
#
# Instalacao no servidor (Ubuntu):
#   sudo cp deploy/nginx/api-tarefas.conf /etc/nginx/sites-available/api-tarefas.conf
#   sudo ln -s /etc/nginx/sites-available/api-tarefas.conf /etc/nginx/sites-enabled/api-tarefas.conf
#   sudo nginx -t
#   sudo systemctl reload nginx
#
# Se existir um dominio apontado para o IP publico da VM, substitua
# "server_name _;" por "server_name seu-dominio.com;" e, em seguida,
# utilize o Certbot (Let's Encrypt) para emitir um certificado HTTPS
# valido. Sem dominio proprio, a aplicacao so pode ser servida por HTTP
# via IP publico — nao existe certificado TLS valido para um IP puro.

server {
    listen 80;
    listen [::]:80;

    # "_" aceita qualquer Host (acesso direto pelo IP publico da VM).
    # Troque por um dominio real quando houver um.
    server_name _;

    # Tamanho maximo do corpo da requisicao (protege contra payloads
    # excessivamente grandes no cadastro/atualizacao de tarefas).
    client_max_body_size 1m;

    access_log /var/log/nginx/api-tarefas.access.log;
    error_log  /var/log/nginx/api-tarefas.error.log;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
}
